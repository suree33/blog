allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true
autoInstallPeers: true
enablePrePostScripts: true
nodeLinker: isolated
overrides:
  '@tailwindcss/typography>postcss-selector-parser': 6.1.6
publicHoistPattern:
  - '*eslint*'
shamefullyHoist: false
strictPeerDependencies: false
