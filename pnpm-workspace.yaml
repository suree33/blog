allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  workerd: true
autoInstallPeers: true
enablePrePostScripts: true
nodeLinker: isolated
overrides:
  '@tailwindcss/typography>postcss-selector-parser': 7.2.1
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
shamefullyHoist: false
strictPeerDependencies: false
