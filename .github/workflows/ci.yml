name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &setup-pnpm
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

      - name: Run Worker tests
        run: pnpm run test:worker

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run git hook tests
        run: |
          git --version
          pnpm run test:git-hooks

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - *checkout
      - *setup-pnpm

      - name: Build
        run: pnpm run build:ci

  worker-integration:
    name: Worker integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *setup-pnpm
      - name: Build
        run: pnpm run build:ci
      - name: Run Worker integration tests
        run: pnpm run test:integration

  visual:
    name: Full-page visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - *checkout
      - *setup-pnpm

      - name: Install screenshot fonts
        run: apt-get update && apt-get install -y fonts-noto-cjk

      - name: Compare full-page screenshots
        run: pnpm run test:e2e:visual

      - name: Upload visual report and differences
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-shard:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: Mobile Chrome
            browser: chromium
          - project: Mobile Safari
            browser: webkit
          - project: Mobile Safari (Small screen)
            browser: webkit

    steps:
      - *checkout
      - *setup-pnpm

      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright E2E tests
        env:
          PROJECT: ${{ matrix.project }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ strategy.job-index }}.zip
        run: pnpm exec playwright test --project="$PROJECT" --reporter=github,list,blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E tests
    needs: [e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - *checkout
      - *setup-pnpm

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        if: ${{ !cancelled() }}
        run: |
          if [ -d all-blob-reports ] && [ -n "$(ls -A all-blob-reports)" ]; then
            pnpm exec playwright merge-reports --reporter html ./all-blob-reports
          fi

      - name: Publish Playwright report to Cloudflare Worker preview
        # フォーク PR ではシークレットが使えないためスキップする。
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.number }}
        run: |
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          summary "## 🎭 Playwright E2E レポート"
          summary ""

          if [[ ! -f playwright-report/index.html ]]; then
            summary "レポートが生成されませんでした。artifact のフォールバックを利用してください。"
            exit 0
          fi

          # プレビュー URL のエイリアスを決める。
          # 同一 PR への push では同じエイリアスを上書きし、常に最新レポートを指す。
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            alias="pr-${PR_NUMBER}"
          else
            # ブランチ名を DNS ラベルとして使える形に整える
            # （小文字 / 英数字とハイフンのみ / 先頭は英字 / 47 文字以内）。
            alias="$(printf '%s' "${GITHUB_REF_NAME:-main}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')"
            alias="${alias:0:47}"
            alias="$(printf '%s' "$alias" | sed -E 's/-+$//')"
            [[ "$alias" =~ ^[a-z] ]] || alias="b-${alias}"
            alias="${alias:0:47}"
            alias="$(printf '%s' "$alias" | sed -E 's/-+$//')"
            [[ -n "$alias" ]] || alias="b-${GITHUB_RUN_ID}"
          fi

          if ! pnpm exec wrangler versions upload --config wrangler.report.toml --preview-alias "$alias"; then
            summary "Cloudflare へのアップロードに失敗しました。artifact のフォールバックを利用してください。"
            exit 0
          fi

          if ! report_url="$(pnpm exec node -e '
            const fs = require("fs");
            const lines = fs
              .readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
              .split(/\r?\n/)
              .filter(Boolean)
              .map((line) => JSON.parse(line));
            const entry = lines.reverse().find((x) => x.type === "version-upload");
            process.stdout.write(entry?.preview_alias_url || entry?.preview_url || "");
          ')"; then
            summary "アップロードは成功しましたが、プレビュー URL の解析に失敗しました。artifact のフォールバックを利用してください。"
            exit 0
          fi

          if [[ -n "$report_url" ]]; then
            summary "[レポートを開く]($report_url)"
          else
            summary "アップロードは成功しましたが、プレビュー URL を取得できませんでした。artifact のフォールバックを利用してください。"
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check E2E shard results
        if: ${{ always() }}
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "E2E shards result: $RESULT"
            exit 1
          fi
